name: Update latest invoice prizes
on:
  workflow_dispatch:
  schedule:
    - cron: '0 3 26 1,3,5,7,9,11 *'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch latest published period
        run: python scripts/update_prizes.py
      - name: Commit changed prize data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add prizes.json
          git diff --cached --quiet || (git commit -m "Update latest invoice prize numbers" && git push)
